<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport
      [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
      [mode]="(isHandset$ | async) ? 'over' : 'side'"
      [opened]="(isHandset$ | async) === false">
    <mat-toolbar>Menu</mat-toolbar>
    <mat-nav-list>
      <!-- Professor Navigation Links -->
      @if (isProfessor) {
        <a mat-list-item routerLink="/d/dashboard">
          <mat-icon>dashboard</mat-icon>
          <span class="nav-link-text">Dashboard</span>
        </a>
        <a mat-list-item routerLink="/d/my-paper-ideas">
          <mat-icon>description</mat-icon>
          <span class="nav-link-text">My Paper Ideas</span>
        </a>
      }
      
      <!-- Admin Navigation Links -->
      @if (isAdmin) {
        <a mat-list-item routerLink="/a/dashboard">
          <mat-icon>admin_panel_settings</mat-icon>
          <span class="nav-link-text">Admin Dashboard</span>
        </a>
      }
      
      <!-- Common Navigation Links -->
      <a mat-list-item routerLink="/frontpage">
        <mat-icon>home</mat-icon>
        <span class="nav-link-text">Home</span>
      </a>
      <a mat-list-item (click)="logout()">
        <mat-icon>exit_to_app</mat-icon>
        <span class="nav-link-text">Logout</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      @if (isHandset$ | async) {
        <button
          type="button"
          aria-label="Toggle sidenav"
          mat-icon-button
          (click)="drawer.toggle()">
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button>
      }
    </mat-toolbar>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
