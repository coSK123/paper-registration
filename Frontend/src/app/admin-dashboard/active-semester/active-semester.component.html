<mat-card>
    <mat-card-header>
        Semester Auswahl
    </mat-card-header>
    <mat-card-content>
      <p>The currently active semester is <b>{{currentlyActiveSemester}}</b> </p>
      <p>Create or choose a semester to activate:</p>
        <mat-form-field >
          <mat-label>Semester</mat-label>
          <input type="text"
                 placeholder="Choose a semester"
                 aria-label="Text"
                 matInput
                 [formControl]="myControl"
                 [matAutocomplete]="auto">
          <mat-autocomplete #auto="matAutocomplete">
            @for (option of filteredOptions | async; track option) {
              <mat-option [value]="option">{{option}}</mat-option>
            }
          </mat-autocomplete>
        </mat-form-field>
    </mat-card-content>
</mat-card>
